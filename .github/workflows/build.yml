# Build dinput.dll from source, run the host tests, package the zip.
# A tag v<version> also creates a draft GitHub release with the zip; its description is
# .github/release-notes.md plus the SHA-256 hashes.
# Third-party actions are pinned by commit SHA (tag in the comment).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools_build
          # the toolchain version and SHA-256 live only in fetch_tools.sh; editing it refreshes the cache
          key: toolchain-${{ hashFiles('tools/fetch_tools.sh') }}

      - name: Fetch toolchain (pinned, SHA-256 checked)
        run: tools/fetch_tools.sh

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver=${GITHUB_REF_NAME#v}
            grep -qF "\"T2MPFix $ver on Thief2MP" mod/src/main.c \
              || { echo "::error::tag $GITHUB_REF_NAME but mod/src/main.c logs another version"; exit 1; }
          else
            ver=$(grep -oP '"T2MPFix \K[0-9.]+(?= on Thief2MP)' mod/src/main.c)-dev+${GITHUB_SHA::7}
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      - name: Build
        run: tools/build.sh

      - name: Tests
        run: |
          make -C mod test
          python3 -I tools/qa/test_analyze.py

      - name: Package and release notes
        env:
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          tools/package.sh "$VER"
          # .github/release-notes.md + the SHA-256 of the zip and of the DLL and ini inside it
          {
            sed -e "s|@VERSION@|$VER|g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" .github/release-notes.md
            echo
            echo '## SHA-256'
            echo
            echo '```'
            (cd dist && sha256sum "T2MPFix-$VER.zip")
            (cd mod/build && sha256sum dinput.dll) | sed 's| dinput.dll$| T2MPFix/dinput.dll|'
            (cd mod && sha256sum T2MPFix.ini) | sed 's| T2MPFix.ini$| T2MPFix/T2MPFix.ini|'
            echo '```'
            echo
            echo '`dinput.dll` is a reproducible build: rebuild this tag with `tools/build.sh` and compare.'
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: T2MPFix-${{ steps.ver.outputs.ver }}
          path: |
            dist/*.zip
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --notes-file dist/RELEASE_NOTES.md \
            --repo "$GITHUB_REPOSITORY" --draft --title "T2MPFix ${GITHUB_REF_NAME#v}"
