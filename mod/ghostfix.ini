; ghostfix settings, see README.md
[ghostfix]
; send your position ~20x/s while moving (everyone should have this on)
send_fix=1
; show other players on their real path (falls back to stock for players without ghostfix)
recv_fix=1
; 0 = stock cap (3 players work). 4 = allow 4 players (Figgis's fix: the engine needs the cap set to N+1)
max_players=4
send_interval_ms=50
delay_min_ms=60
delay_max_ms=300
telemetry=0
