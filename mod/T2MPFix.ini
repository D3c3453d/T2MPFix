; T2MPFix settings, see README.md. Four separate fixes; 0 turns one off without affecting the others.
[T2MPFix]

; --- Fix 1: smooth remote players (two halves; everyone should have both on) ---
; send your position ~20x/s while moving
send_fix=1
; show other players on their real path (players without send_fix are left to the stock steering)
recv_fix=1
send_interval_ms=50
delay_min_ms=60
delay_max_ms=300

; --- Fix 2: stock steering bug ---
; 1 = players that recv_fix doesn't interpolate are pulled toward their predicted position instead of
; drifting behind (the engine tests uninitialized memory there)
steer_fix=1

; --- Fix 3: 4-player cap ---
; 0 = stock cap (3 players work). 4 = allow 4 players (Figgis's fix: the engine needs the cap set to N+1)
max_players=4

; --- Fix 4: lava damage ---
; 1 = lava and other local-only hazards hurt players again (stock multiplayer drops that damage)
damage_fix=1

telemetry=0
